name: Publish to PyPI (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub Release tag to publish (e.g. v27.1.2). Must already exist."
        required: true
        type: string
      confirm:
        description: "Confirm publish to PyPI"
        required: true
        type: boolean
      docs_only:
        description: "Only publish documentation (skip package publish)"
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  guard-ci-success:
    runs-on: windows-2022
    permissions:
      contents: read
      statuses: read
      actions: read
    steps:
      - name: Ensure CI for this commit succeeded
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ownerRepo = $env:GITHUB_REPOSITORY
          $sha = $env:GITHUB_SHA
          $authValue = "token $env:GITHUB_TOKEN"
          $headers = @{
            Authorization = $authValue #gitleaks:allow
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          $workflow = 'ci.yml'
          $branch = $env:GITHUB_REF_NAME
          $url = "https://api.github.com/repos/$ownerRepo/actions/workflows/$workflow/runs?branch=$branch&per_page=20"

          try {
            $resp = Invoke-RestMethod -Method Get -Uri $url -Headers $headers -ErrorAction Stop
          } catch {
            Write-Error "Blocking publish: failed to query CI workflow runs ($($_.Exception.Message))"
            exit 1
          }

          if (-not $resp.workflow_runs) {
            Write-Error "Blocking publish: no CI runs found on branch '$branch'"
            exit 1
          }

          $matching = $resp.workflow_runs | Where-Object { $_.head_sha -eq $sha -and $_.status -eq 'completed' }
          if (-not $matching) {
            Write-Error "Blocking publish: no completed CI run found for commit $sha"
            exit 1
          }

          $success = $matching | Where-Object { $_.conclusion -eq 'success' } | Select-Object -First 1
          if (-not $success) {
            $concl = ($matching | Select-Object -First 1).conclusion
            Write-Error "Blocking publish: CI conclusion for $sha is '$concl'"
            exit 1
          }

  publish:
    needs: guard-ci-success
    if: ${{ github.event.inputs.confirm == 'true' && startsWith(github.ref_name, 'release/') }}
    runs-on: windows-2022
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate release tag exists
        id: validate_tag
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          $ownerRepo = $env:GITHUB_REPOSITORY
          $authValue = "token $env:GITHUB_TOKEN"
          $headers = @{
            Authorization = $authValue #gitleaks:allow
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          $url = "https://api.github.com/repos/$ownerRepo/releases/tags/$tag"
          try {
            $release = Invoke-RestMethod -Method Get -Uri $url -Headers $headers -ErrorAction Stop
          } catch {
            Write-Error "Release tag '$tag' not found. Create a GitHub Release first using the 'Create GitHub Release' workflow."
            exit 1
          }

          $version = $tag -replace '^v', ''
          Write-Output "Release '$tag' found (id: $($release.id))"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_id=$($release.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Check if version exists on PyPI
        id: pypi_check
        shell: pwsh
        if: ${{ github.event.inputs.docs_only != 'true' }}
        run: |
          $packageName = 'moldflow'
          $version = "${{ steps.validate_tag.outputs.version }}"

          try {
            $resp = Invoke-WebRequest -Uri "https://pypi.org/pypi/$packageName/json" -UseBasicParsing -ErrorAction Stop
            $data = $resp.Content | ConvertFrom-Json
            $versions = @($data.releases.PSObject.Properties.Name)
          } catch {
            $versions = @()
          }

          $exists = if ($versions -contains $version) { 'true' } else { 'false' }
          Write-Output "Version $version exists on PyPI: $exists"
          "exists=$exists" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Skip publish, version already exists
        if: ${{ github.event.inputs.docs_only != 'true' && steps.pypi_check.outputs.exists == 'true' }}
        run: |
          Write-Output "Version ${{ steps.validate_tag.outputs.version }} already exists on PyPI. Skipping publish."

      - name: Check older releases are on PyPI
        if: ${{ github.event.inputs.docs_only != 'true' && steps.pypi_check.outputs.exists == 'false' }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          $targetVersion = $tag -replace '^v', ''
          $targetSemVer = [version]$targetVersion
          $ownerRepo = $env:GITHUB_REPOSITORY
          $packageName = 'moldflow'
          $authValue = "token $env:GITHUB_TOKEN"
          $headers = @{
            Authorization = $authValue #gitleaks:allow
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          $releasesUrl = "https://api.github.com/repos/$ownerRepo/releases?per_page=100"
          $releases = @(Invoke-RestMethod -Method Get -Uri $releasesUrl -Headers $headers -ErrorAction Stop)

          try {
            $pypiResp = Invoke-WebRequest -Uri "https://pypi.org/pypi/$packageName/json" -UseBasicParsing -ErrorAction Stop
            $pypiData = $pypiResp.Content | ConvertFrom-Json
            $pypiVersions = @($pypiData.releases.PSObject.Properties.Name)
          } catch {
            Write-Error "Could not query PyPI to verify publish order. Aborting."
            exit 1
          }

          $blocking = @()
          foreach ($release in $releases) {
            if ($release.draft -or $release.prerelease) { continue }

            $version = $release.tag_name -replace '^v', ''
            try {
              $releaseSemVer = [version]$version
            } catch {
              Write-Output "Skipping non-semver release tag: $($release.tag_name)"
              continue
            }

            if ($releaseSemVer -ge $targetSemVer) { continue }
            if ($pypiVersions -contains $version) { continue }

            $blocking += $release.tag_name
          }

          if ($blocking.Count -eq 0) {
            Write-Output "All older GitHub releases are on PyPI. Proceeding with publish of $tag."
            exit 0
          }

          Write-Output ""
          Write-Output "=== UNPUBLISHED OLDER RELEASES ==="
          Write-Output "Cannot publish $tag until these older releases are on PyPI:"
          Write-Output ""
          foreach ($item in ($blocking | Sort-Object)) {
            Write-Output "  - $item"
          }
          Write-Output ""
          Write-Output "Publish the oldest missing version first."
          Write-Output ""

          Write-Error "Found $($blocking.Count) older release(s) not on PyPI."
          exit 1

      - name: Download wheel from GitHub Release
        if: ${{ github.event.inputs.docs_only != 'true' && steps.pypi_check.outputs.exists == 'false' }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          $version = "${{ steps.validate_tag.outputs.version }}"
          $ownerRepo = $env:GITHUB_REPOSITORY
          $authValue = "token $env:GITHUB_TOKEN"
          $headers = @{
            Authorization = $authValue #gitleaks:allow
            Accept = 'application/octet-stream'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          $apiHeaders = @{
            Authorization = $authValue #gitleaks:allow
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          $url = "https://api.github.com/repos/$ownerRepo/releases/tags/$tag"
          $release = Invoke-RestMethod -Method Get -Uri $url -Headers $apiHeaders -ErrorAction Stop

          New-Item -ItemType Directory -Path dist -Force | Out-Null

          $assets = $release.assets
          if (-not $assets -or $assets.Count -eq 0) {
            Write-Error "No assets found on release '$tag'. Ensure the release was created with the 'Create GitHub Release' workflow."
            exit 1
          }

          foreach ($asset in $assets) {
            $name = $asset.name
            $downloadUrl = $asset.browser_download_url
            Write-Output "Downloading: $name"
            Invoke-WebRequest -Uri $downloadUrl -OutFile "dist/$name" -UseBasicParsing
          }

          $whlFiles = Get-ChildItem -Path dist -Filter "*.whl"
          if ($whlFiles.Count -eq 0) {
            Write-Error "No .whl file found in release assets for '$tag'"
            exit 1
          }

          Write-Output "Downloaded $($whlFiles.Count) wheel(s) to dist/"

      - name: Publish to PyPI
        if: ${{ github.event.inputs.docs_only != 'true' && steps.pypi_check.outputs.exists == 'false' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine check --strict dist/*
          python -m twine upload --verbose dist/*

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Fetch Git tags
        run: git fetch --tags

      - name: Build documentation
        run: python run.py build-docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs/build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
